name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs /bin/bash 3.2 — the repo's compatibility floor
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Lesson-sync privacy guard test
        run: /bin/bash ./test-sync-lessons.sh

      - name: Hook contract tests
        run: /bin/bash ./scripts/test-hooks.sh

      - name: Installer end-to-end test (fake HOME)
        run: /bin/bash ./scripts/test-install.sh

      - name: Drift-check smoke test
        run: /bin/bash ./scripts/drift-check.sh --json

      - name: Drift-check precision regression tests
        run: /bin/bash ./scripts/test-drift-check.sh

      - name: Maintenance self-audit tests
        run: /bin/bash ./scripts/test-maintenance.sh

      - name: Docs match reality (self-audit)
        run: /bin/bash ./scripts/maintenance-check.sh

      - name: settings.base.json is valid JSON
        run: python3 -c "import json; json.load(open('settings.base.json'))"
